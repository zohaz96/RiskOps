{% extends "base.html" %}

{% block title %}RiskOps — Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-1">Reset your password</h5>
                <p class="text-muted small mb-4">Enter your email and we'll send you a reset link.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control" placeholder="Email address" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send reset link</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'users:login' %}" class="text-muted small">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
