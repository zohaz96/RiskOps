{% extends "base.html" %}

{% block title %}RiskOps — Check your email{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4 text-center mt-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <i class="bi bi-envelope text-primary" style="font-size: 2.5rem;"></i>
                <h5 class="mt-3 fw-bold">Check your email</h5>
                <p class="text-muted">If that address is registered, you'll get a reset link shortly.</p>
                <a href="{% url 'users:login' %}" class="btn btn-outline-primary mt-2">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
